# Local production-like stack: FastAPI backend + PostgreSQL.
# Usage:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jtracks
      POSTGRES_PASSWORD: jtracks
      POSTGRES_DB: jtracks
    ports:
      - "5432:5432"
    volumes:
      - jtracks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jtracks -d jtracks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://jtracks:jtracks@db:5432/jtracks
      AUTO_CREATE_TABLES: "false"
      RUN_SCHEDULER: "true"
      JWT_SECRET: change-me-in-real-deployments
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GOOGLE_CLIENT_ID: ""
    ports:
      - "8000:8000"

volumes:
  jtracks_pgdata:
