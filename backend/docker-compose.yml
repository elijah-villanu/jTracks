# Local production-like stack: FastAPI backend + PostgreSQL.
# Usage:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jtracks
    ports:
      - "5433:5432"
    volumes:
      - jtracks_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jtracks"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Container-to-container traffic always uses the service name (`db`) and
      # the container's own port (5432) -- the 5433 host-side mapping above is
      # only for reaching Postgres from outside Docker (e.g. `psql` on the host).
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/jtracks
      AUTO_CREATE_TABLES: "false"
      RUN_SCHEDULER: "true"
      # Never hardcode this. Compose refuses to start if JWT_SECRET is unset in
      # your shell/.env, which is the point — a shared secret in source control
      # lets anyone forge a token for any account. Generate with:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before running compose}
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      GOOGLE_CLIENT_ID: ""
    ports:
      - "8000:8000"

volumes:
  jtracks_pgdata:
