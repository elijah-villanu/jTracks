[pytest]
testpaths = tests
addopts = -q
filterwarnings =
    ignore::DeprecationWarning:asyncio
    ; asyncio.iscoroutinefunction deprecation is raised from within
    ; fastapi/starlette internals on Python 3.14, not this project's code.
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
