    return `<h3 id="set-title">Ghosting</h3><p class="lead">When a job you applied to goes quiet, JourneyJob marks it Ghosted for you.</p>
    <form class="ghost-form set-sec" id="ghost-form" novalidate>
      <div><label for="ghost-days"><b style="font-weight:500">Mark as Ghosted after</b></label>
        <div class="ghost-input" style="margin-top:8px"><input class="field" id="ghost-days" type="number" min="1" max="365" step="1" value="${ghostDays}" aria-describedby="ghost-help ghost-preview"><span>days with no update</span></div>
        <p class="muted" id="ghost-help" style="margin-top:8px;font-size:13px">Only applies to Applied. Interviews, offers and rejections are never changed for you.</p>
      </div>
      <div class="preview" id="ghost-preview" aria-live="polite"></div>
      <div class="form-end"><span class="stamp" id="stamp">${savedStamp}</span><button class="btn btn-ink" type="submit">Save</button></div>
    </form>
    <section class="set-sec" aria-label="Per-application limits">
      <div class="row-s"><div class="txt"><b>Per-application limits</b><span>${plural(overrides, 'application uses', 'applications use')} its own limit. Set one from an application's edit form.</span></div></div>
    </section>`;
  },
  appearance: () => `<h3 id="set-title">Appearance</h3><p class="lead">Changes save as you make them, on this browser.</p>
    <section class="set-sec" aria-label="Theme"><h4>Theme</h4>
      <div class="choices" role="radiogroup" aria-label="Theme">${[['light', 'Light', '#fafafa', '#ffffff'], ['dark', 'Dark', '#171717', '#2a2a2a'], ['system', 'Match system', 'linear-gradient(90deg,#fafafa 50%,#171717 50%)', 'linear-gradient(90deg,#ffffff 50%,#2a2a2a 50%)']].map(([v, l, a, b]) => `<label class="choice"><input type="radio" name="theme" value="${v}" ${theme === v ? 'checked' : ''}><span class="sample" aria-hidden="true"><i style="background:${a}"></i><i style="background:${b}"></i></span><span>${l}</span></label>`).join('')}</div>
    </section>
    <section class="set-sec" aria-label="Tracker"><div class="row-s"><div class="txt"><b>Tracker opens in</b><span>You can still switch any time from the Tracker.</span></div><div class="ctl end"><div class="seg" role="group" aria-label="Default view"><button type="button" data-def-view="board" aria-pressed="${state.view === 'board'}">Board</button><button type="button" data-def-view="table" aria-pressed="${state.view === 'table'}">Table</button></div></div></div></section>
    <section class="set-sec" aria-label="Recap design"><h4>Recap design</h4><span class="muted" style="font-size:13px">The design the recap opens on.</span>
      <div class="choices" role="radiogroup" aria-label="Recap design">${[['ink', 'Dark', '#18181b'], ['field', 'Headline', '#e6e6e9'], ['paper', 'Ranked', '#ffffff']].map(([v, l, c]) => `<label class="choice"><input type="radio" name="rd" value="${v}" ${design === v ? 'checked' : ''}><span class="mini-cards" aria-hidden="true"><i style="background:${c};box-shadow:inset 0 0 0 1px #e4e4e7"></i></span><span>${l}</span></label>`).join('')}</div>
    </section>`,
  notifications: () => `<h3 id="set-title">Notifications</h3><p class="lead">Email notifications are on the way. Nothing is sent yet.</p>
    <section class="set-sec" aria-label="Email">
      ${soonRow('An application was ghosted', 'One email the day JourneyJob marks something Ghosted.', '<button class="toggle" type="button" role="switch" aria-checked="false" disabled aria-label="Ghosted emails"></button>')}
      ${soonRow('Weekly summary', 'Monday morning: what you sent, what came back, what is going quiet.', '<button class="toggle" type="button" role="switch" aria-checked="false" disabled aria-label="Weekly summary"></button>')}
      ${soonRow('Nudge after a quiet week', 'A reminder when nothing has been logged for 7 days.', '<button class="toggle" type="button" role="switch" aria-checked="false" disabled aria-label="Quiet week nudge"></button>')}
    </section>`,
  data: () => `<h3 id="set-title">Your data</h3><p class="lead">Your board is private. Nobody else can see an application, a company or a note.</p>
    <section class="set-sec" aria-label="Export and import">
      ${soonRow('Export applications', `Download all ${apps.length} applications as a CSV file.`, '<button class="btn btn-line" type="button" disabled>' + icon('download') + 'Export CSV</button>')}
      ${soonRow('Import from a spreadsheet', 'Bring in a search you tracked somewhere else.', '<button class="btn btn-line" type="button" disabled>Import</button>')}
    </section>`,
};
function ghostPreview() {
  const v = Number(document.getElementById('ghost-days')?.value);
  const box = document.getElementById('ghost-preview');
  if (!box) return;
  if (!Number.isInteger(v) || v < 1 || v > 365) { box.innerHTML = '<span style="color:var(--danger)">Enter a whole number of days from 1 to 365.</span>'; return; }
  const waiting = apps.filter((a) => a.status === 'applied' && !a.override);
  const wouldGhost = waiting.filter((a) => quietFor(a) >= v).length;
  box.innerHTML = `<div class="tl"><span>Apply today</span><span class="line" style="--p:100%"></span><span><b>Ghosted ${md(T + v)}</b></span></div>
    <span class="muted" style="font-size:13px">${v === ghostDays ? `Current setting. ${plural(waiting.length, 'application')} use it.` : wouldGhost ? `Saving moves ${plural(wouldGhost, 'application')} to Ghosted today.` : `No application changes today.`}</span>`;
}
function renderSettings() {
  setDlg.querySelectorAll('[data-tab]').forEach((b) => { const on = b.dataset.tab === setTab; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; });
  const main = document.getElementById('set-main');
  main.setAttribute('aria-labelledby', `tab-${setTab}`);
  main.innerHTML = closeBtn + PANELS[setTab]();
  ghostPreview();
}
function openSettings(tab) {
  setTab = TABS.some((t) => t[0] === tab) ? tab : 'account';
  renderSettings();
  if (!setDlg.open) setDlg.showModal();
  setDlg.querySelector(`[data-tab="${setTab}"]`).focus();
}
setDlg.addEventListener('click', (e) => {
  const t = e.target.closest('[data-tab]');
  if (t) { setTab = t.dataset.tab; renderSettings(); t.focus(); return; }
  const dv = e.target.closest('[data-def-view]');
  if (dv) { state.view = dv.dataset.defView; try { localStorage.setItem('wf-app-view', state.view); } catch (err) {} setDlg.querySelectorAll('[data-def-view]').forEach((b) => b.setAttribute('aria-pressed', String(b === dv))); render(); }
});
setDlg.querySelector('.set-tabs').addEventListener('keydown', (e) => {
  if (!['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  e.preventDefault();
  const i = TABS.findIndex((t) => t[0] === setTab), n = e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1;
  setTab = TABS[(i + n + TABS.length) % TABS.length][0];
  renderSettings();
  setDlg.querySelector(`[data-tab="${setTab}"]`).focus();
});
setDlg.addEventListener('input', (e) => { if (e.target.id === 'ghost-days') { savedStamp = ''; document.getElementById('stamp').textContent = ''; ghostPreview(); } });
setDlg.addEventListener('change', (e) => {
  if (e.target.name === 'theme') applyTheme(e.target.value);
  if (e.target.name === 'rd') { design = e.target.value; try { localStorage.setItem('wf-app-design', design); } catch (err) {} }
});
setDlg.addEventListener('submit', (e) => {
  e.preventDefault();
  const input = document.getElementById('ghost-days');
  const v = Number(input.value);
  if (!Number.isInteger(v) || v < 1 || v > 365) { input.focus(); return; }
  ghostDays = v;
  savedStamp = 'Saved';
  document.getElementById('stamp').textContent = 'Saved';
  ghostPreview();
});

/* ======================= dialogs: close on X, Escape and the backdrop ======================= */
[recapDlg, setDlg].forEach((d) => {
  d.addEventListener('click', (e) => {
    if (e.target.closest('[data-close]')) d.close();
    else if (e.target === d) { const r = d.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close(); }
  });
});

document.getElementById('open-recap').setAttribute('aria-haspopup', 'dialog');
route();
</script>
</body>
</html>
