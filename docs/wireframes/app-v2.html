<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JourneyJob app (wireframe v2)</title>
<meta name="description" content="Mid-fidelity wireframe of the signed-in JourneyJob app: top bar, Tracker board and table, Analytics, the recap dialog and the settings modal.">
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet">
<script>
  // Theme before first paint: light, dark or system (stored per browser).
  (function () {
    var t = 'system';
    try { t = localStorage.getItem('wf-app-theme') || 'system'; } catch (e) {}
    var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  /*
    Wireframe v2 of the signed-in app (2026-11-11), built from app-v1.html: the ghost
    countdown is a ring on the card, columns sort, one shared status filter, icon-only Move,
    a fade where the board runs off the screen (desktop), and a leaner Analytics page.
    Wireframe v1 was 2026-11-10. Same day, smaller pass: ring and table rows top-aligned with the
    logo, icon-only filter and (on phones) view switch, hover/tap notes on the ring and on four
    Analytics panels, side fades on the phone board, and a one-card recap with arrows on phones. Same world as landing-v5:
    Switzer, the zinc neutrals on #fafafa, #171717 for dark mode, and #0F57FE.
    Colour goes on data and on one control per screen; chrome stays neutral.
    Grid arithmetic (Analytics, 1440 wide): frame 1280 = 2 x 32 gutter + 1216 content;
    12 fluid columns, 11 gaps of 16: 12 x 86.67 + 11 x 16 = 1216. Rows pair 6 + 6, 7 + 5 and
    8 + 4 columns, so every row lands on both content edges.
  */
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --raised: #f1f1f2;
    --field: #e6e6e9;
    --border: #e4e4e7;
    --rule: #efeff1;
    --control: #d4d4d8;
    --ink: #18181b;
    --muted: #52525b;
    --faint: #6b6b73;
    --primary: #18181b;
    --primary-ink: #ffffff;
    --primary-hover: #3f3f46;
    --accent: #0F57FE;
    --accent-hover: #0a45cc;
    --accent-tint: #e7eeff;
    --focus: #0F57FE;
    --danger: #c31b1f;
    --danger-tint: #fdecec;
    --warn-ink: #92400e;
    --warn-tint: #fffbeb;
    --positive: #247b50;
    /* Funnel and status greys (the landing page's funnel palette). */
    --s-node: #18181b;
    --s-int: #71717a;
    --s-rej: #d4d4d8;
    --s-gho: #a1a1aa;
    --s-fail: #3f3f46;
    --hatch-bg: #f4f4f5;
    --hatch-line: #a1a1aa;
    --dot-saved: #a1a1aa;
    --dot-applied: #0F57FE;
    --dot-interviewing: #d97706;
    --dot-offer: #16a34a;
    --dot-rejected: #d4d4d8;
    --dot-failed: #3f3f46;
    --dot-ghosted: #a1a1aa;
    --shadow-float: 0 1px 2px rgb(0 0 0 / 0.06), 0 8px 24px rgb(0 0 0 / 0.12);

    --font: "Switzer", ui-sans-serif, system-ui, sans-serif;
    --m: clamp(16px, 2.5vw, 32px);
    --gap: 16px;
    --top-h: 56px;
    --bottom-h: 0px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #171717;
    --surface: #202020;
    --raised: #2a2a2a;
    --field: #333333;
    --border: #2e2e2e;
    --rule: #282828;
    --control: #404040;
    --ink: #ebebeb;
    --muted: #b1b1b1;
    --faint: #949494;
    --primary: #ebebeb;
    --primary-ink: #171717;
    --primary-hover: #ffffff;
    --accent-hover: #296aff;
    --accent-tint: #1b2a4d;
    --focus: #4f88ff;
    --danger: #ec5d53;
    --danger-tint: #3a1d1b;
    --warn-ink: #f2b45a;
    --warn-tint: #33280f;
    --positive: #4cc38a;
    --s-node: #ebebeb;
    --s-int: #8a8a8a;
    --s-rej: #4a4a4a;
    --s-gho: #6b6b6b;
    --s-fail: #b1b1b1;
    --hatch-bg: #262626;
    --hatch-line: #6b6b6b;
    --dot-rejected: #5c5c5c;
    --dot-failed: #b1b1b1;
    --dot-ghosted: #7a7a7a;
    --dot-saved: #7a7a7a;
    --shadow-float: 0 1px 2px rgb(0 0 0 / 0.4), 0 12px 32px rgb(0 0 0 / 0.5);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.43 var(--font); letter-spacing: -0.005em;
    font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, p, dl, dd, ol, ul, figure { margin: 0; }
  ol, ul { padding: 0; list-style: none; }
  button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
  a { color: inherit; }
  img, svg { display: block; }
  ::selection { background: var(--accent-tint); color: var(--ink); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  * { scrollbar-width: thin; scrollbar-color: var(--control) transparent; }
  [hidden] { display: none !important; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .i-sm { width: 14px; height: 14px; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  .skip { position: absolute; left: 8px; top: -60px; z-index: 100; background: var(--primary); color: var(--primary-ink); padding: 8px 12px; border-radius: 8px; }
  .skip:focus { top: 8px; }

  /* ---------- controls ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid transparent;
    background: transparent; font-weight: 500; white-space: nowrap; cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease, transform 120ms var(--ease-out);
  }
  .btn:active { transform: scale(0.97); }
  .btn-ink { background: var(--primary); color: var(--primary-ink); }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-line { background: var(--surface); border-color: var(--control); }
  .btn-danger-line { background: var(--surface); border-color: var(--control); color: var(--danger); }
  .btn[disabled] { cursor: not-allowed; color: var(--muted); background: var(--raised); border-color: transparent; }
  .btn[disabled]:active { transform: none; }
  @media (hover: hover) and (pointer: fine) {
    .btn-ink:hover { background: var(--primary-hover); }
    .btn-accent:hover { background: var(--accent-hover); }
    .btn-line:hover, .btn-ghost:hover, .btn-danger-line:hover:not([disabled]) { background: var(--raised); }
  }
  .seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 10px; background: var(--raised); }
  .seg button {
    display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
    border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-weight: 500; cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
  :root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--field); box-shadow: none; }
  @media (hover: hover) and (pointer: fine) { .seg button[aria-pressed="false"]:hover { color: var(--ink); } }
  .field {
    height: 32px; border: 1px solid var(--control); border-radius: 8px; background: var(--surface);
    padding: 0 10px; min-width: 0;
  }
  .search { position: relative; display: flex; align-items: center; }
  .search .i { position: absolute; left: 10px; color: var(--muted); pointer-events: none; }
  .search input { width: 100%; padding-left: 32px; }
  .search input::placeholder { color: var(--faint); }
  .soon {
    display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px;
    background: var(--raised); color: var(--muted); font-size: 12px; font-weight: 500; flex: none;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--muted)); }
  .dot-saved { --c: transparent; box-shadow: inset 0 0 0 1.5px var(--dot-saved); }
  .dot-applied { --c: var(--dot-applied); }
  .dot-interviewing_oa { --c: var(--dot-interviewing); }
  .dot-offer { --c: var(--dot-offer); }
  .dot-rejected { --c: var(--dot-rejected); }
  .dot-failed { --c: var(--dot-failed); }
  .dot-ghosted { --c: var(--dot-ghosted); }
  .mono {
    width: 32px; height: 32px; border-radius: 8px; flex: none; display: grid; place-items: center;
    background: var(--raised); color: var(--muted); font-weight: 600; font-size: 13px;
  }

  /* ---------- top bar ---------- */
  .top {
    position: sticky; top: 0; z-index: 30; height: var(--top-h);
    display: flex; align-items: center; gap: 20px; padding: 0 var(--m);
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .logo { display: inline-flex; align-items: center; height: 40px; flex: none; }
  .logo img { height: 24px; width: auto; }
  .logo .on-dark, :root[data-theme="dark"] .logo .on-light { display: none; }
  :root[data-theme="dark"] .logo .on-dark { display: block; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 8px;
    color: var(--muted); text-decoration: none; font-weight: 500; transition: background-color 150ms ease, color 150ms ease;
  }
  .tab[aria-current="page"] { background: var(--raised); color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .tab:hover { color: var(--ink); } }
  .top-end { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: var(--field); color: var(--ink); font-weight: 600; font-size: 13px; display: grid; place-items: center;
  }
  .bottom { display: none; }

  /* ---------- menus (popovers) ---------- */
  .menu {
    position: fixed; z-index: 60; min-width: 220px; padding: 6px; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-float);
    transform-origin: var(--origin, top right); animation: pop 160ms var(--ease-out);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.96); } }
  .menu [role^="menuitem"] {
    width: 100%; display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 10px;
    border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer;
  }
  .menu [role^="menuitem"]:focus-visible { outline: 0; background: var(--raised); }
  @media (hover: hover) and (pointer: fine) { .menu [role^="menuitem"]:hover { background: var(--raised); } }
  .menu .sub { display: block; font-size: 12px; color: var(--muted); }
  .menu .head { padding: 8px 10px 10px; border-bottom: 1px solid var(--rule); margin-bottom: 6px; }
  .menu .head b { display: block; font-weight: 600; }
  .menu hr { border: 0; border-top: 1px solid var(--rule); margin: 6px 0; }
  .menu .check { margin-left: auto; visibility: hidden; }
  .menu [aria-checked="true"] .check { visibility: visible; }
  .menu .cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--control); display: grid; place-items: center; flex: none; color: transparent; }
  .menu .cb .i { width: 12px; height: 12px; stroke-width: 3; }
  .menu [aria-checked="true"] .cb { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .menu .n { margin-left: auto; color: var(--muted); font-size: 13px; padding-left: 16px; }
  .menu .menu-title { padding: 6px 10px 4px; font-size: 12px; color: var(--muted); }
  .menu .theme-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 4px 4px 10px; }
  .menu .seg [role="menuitemradio"] { width: auto; height: 28px; min-height: 28px; padding: 0 8px; color: var(--muted); }
  .menu .seg [aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.08); }
  :root[data-theme="dark"] .menu .seg [aria-checked="true"] { background: var(--field); box-shadow: none; }
  .menu .seg [role="menuitemradio"]:focus-visible { outline: 2px solid var(--focus); outline-offset: 0; background: var(--surface); }

  /* ---------- tracker ---------- */
  .bar { display: flex; align-items: center; gap: 12px; padding: 16px var(--m) 14px; flex-wrap: wrap; }
  .bar h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 8px; }
  .bar h1 span { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
  .bar .search { width: min(320px, 100%); margin-left: 12px; }
  .bar-end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .filter-btn { min-width: 32px; padding: 0 8px; }
  .filter-btn .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: 12px; font-weight: 600; display: inline-grid; place-items: center; }

  .tracker[data-view="board"] { height: calc(100dvh - var(--top-h) - var(--bottom-h)); display: flex; flex-direction: column; }
  /* The board fills the window; its one horizontal scrollbar sits on the window's bottom edge. */
  .board-wrap { flex: 1; min-height: 0; display: flex; position: relative; }
  .board { flex: 1; min-width: 0; min-height: 0; display: flex; gap: var(--gap); overflow-x: auto; overflow-y: hidden; padding: 0 var(--m); position: relative; }
  .board-empty { margin: 24px 0; padding: 32px 16px; border: 1px dashed var(--control); border-radius: 12px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; flex: 1; align-self: start; }
  /* Desktop only: where columns run off the right edge, they fade out instead of looking cut. Stops above the scrollbar, and goes once you reach the end. */
  .board-fade { display: none; }
  @media (min-width: 900px) and (hover: hover) and (pointer: fine) {
    .board-fade:not(.board-fade-l) { display: block; position: absolute; top: 0; right: 0; bottom: var(--sb, 0px); width: 120px; pointer-events: none; background: linear-gradient(to right, transparent, var(--bg)); transition: opacity 200ms ease; }
    .board-wrap.at-end .board-fade { opacity: 0; }
  }
  /* Phones and touch tablets: a narrow fade on each side, shown only where there is more board that way. */
  @media (max-width: 899px), (hover: none), (pointer: coarse) {
    .board-fade { display: block; position: absolute; top: 0; right: 0; bottom: var(--sb, 0px); width: 28px; pointer-events: none; background: linear-gradient(to right, transparent, var(--bg)); transition: opacity 200ms ease; }
    .board-fade-l { left: 0; right: auto; background: linear-gradient(to left, transparent, var(--bg)); }
    .board-wrap.at-end .board-fade:not(.board-fade-l), .board-wrap.at-start .board-fade-l { opacity: 0; }
  }
  .board::after { content: ""; flex: none; width: 1px; }
  .col { flex: none; width: 300px; display: flex; flex-direction: column; min-height: 0; }
  .col-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 0 0 2px; flex: none; }
  .col-sort { margin-left: auto; width: 28px; height: 28px; padding: 0; color: var(--muted); }
  .col-head h2 { font-size: 14px; font-weight: 600; }
  .col-head .count { color: var(--muted); font-weight: 500; }
  .col-list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 2px 2px 20px; }
  .col-empty { border: 1px dashed var(--control); border-radius: 12px; padding: 20px 16px; color: var(--muted); text-align: center; font-size: 13px; }
  .more { width: 100%; }

  .job {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 14px 10px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 12px; flex: none;
  }
  .job-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .job-co { color: var(--muted); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-title { font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .job-meta { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .job-main { display: grid; gap: 10px; min-width: 0; }
  /* Ghost countdown: the ring fills as an Applied job stays quiet; the number is days left. Amber and full: an interview with no update in 28+ days. */
  .ring { position: relative; width: 40px; height: 40px; align-self: start; display: grid; place-items: center; cursor: default; }
  .ring svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 2.5; }
  .ring-track { stroke: var(--field); }
  .ring-arc { stroke: var(--s-int); stroke-linecap: round; }
  .ring span { font-size: 12px; font-weight: 600; color: var(--muted); }
  .ring.near .ring-arc { stroke: var(--danger); }
  .ring.near span { color: var(--danger); }
  .ring.stale .ring-arc { stroke: var(--warn-ink); }
  .ring.stale span { color: var(--warn-ink); }
  .job-foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--rule); padding-top: 8px; color: var(--muted); font-size: 13px; }
  .move { width: 28px; height: 28px; padding: 0; color: var(--muted); }

  .table-wrap { padding: 0 var(--m) 32px; }
  .table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table th { text-align: left; font-size: 13px; font-weight: 400; color: var(--muted); height: 40px; padding: 0 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .table th button { all: unset; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .table th button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .table th[aria-sort="none"] .i { visibility: hidden; }
  .table td { padding: 10px 16px; border-top: 1px solid var(--rule); vertical-align: middle; }
  .table tr:first-child td { border-top: 0; }
  .table .r { text-align: right; }
  .table th.r button { justify-content: flex-end; }
  .who { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .who b { display: block; font-weight: 600; line-height: 18px; margin-top: -1px; }
  .who span { color: var(--muted); font-size: 13px; }
  .st { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; white-space: nowrap; }
  @media (hover: hover) and (pointer: fine) { .st:hover, .move:hover, .col-sort:hover { background: var(--raised); color: var(--ink); } }
  .table .quiet-near { color: var(--danger); }
  .table-empty { padding: 32px 16px; text-align: center; color: var(--muted); }
  .pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 0 0; }

  /* ---------- analytics ---------- */
  .frame { width: 100%; max-width: 1280px; margin: 0 auto; padding: 0 var(--m); }
  .an { padding-bottom: 64px; }
  .title-row { display: flex; align-items: flex-end; gap: 16px; padding: 28px 0 20px; flex-wrap: wrap; }
  .title-row h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; }
  .title-row p { color: var(--muted); margin-top: 4px; }
  .title-end { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .custom { display: none; gap: 6px; align-items: center; color: var(--muted); }
  .custom.on { display: inline-flex; }
  .custom input { width: 140px; }
  .recap-btn svg { width: 14px; height: 16px; }

  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .kpi { padding: 16px 20px; border-left: 1px solid var(--rule); display: grid; gap: 2px; align-content: start; }
  .kpi:first-child { border-left: 0; }
  .kpi dt { color: var(--muted); font-size: 13px; }
  .kpi dd { display: grid; gap: 2px; }
  .kpi .v { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.25; }
  .kpi .v small { font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
  .kpi .delta { font-size: 13px; color: var(--muted); }
  .delta.good { color: var(--positive); }
  .delta.bad { color: var(--danger); }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: var(--gap); margin-top: var(--gap); }
  .span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-7 { grid-column: span 7; }
  .span-6 { grid-column: span 6; } .span-5 { grid-column: span 5; } .span-4 { grid-column: span 4; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-width: 0; display: flex; flex-direction: column; }
  .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; min-height: 28px; }
  .info { margin-left: auto; width: 28px; height: 28px; padding: 0; color: var(--muted); }
  @media (hover: hover) and (pointer: fine) { .info:hover { background: var(--raised); color: var(--ink); } }
  .info[aria-expanded="true"] { background: var(--raised); color: var(--ink); }
  /* One small note for the ring and the panel "i" buttons: hover, focus or tap. */
  .tip { position: fixed; z-index: 70; max-width: 260px; padding: 7px 10px; border-radius: 8px; background: var(--primary); color: var(--primary-ink); font-size: 12px; line-height: 1.45; white-space: pre-line; box-shadow: var(--shadow-float); pointer-events: none; }
  .tip.lead::first-line { font-weight: 600; }
  .panel-head h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
  .panel-head .aside { margin-left: auto; color: var(--muted); font-size: 13px; text-align: right; }
  .panel-foot { margin-top: auto; padding-top: 16px; color: var(--muted); font-size: 13px; }
  .panel-foot a { color: var(--ink); text-underline-offset: 3px; }

  /* Sankey: the screen's biggest block. */
  .flow { display: block; }
  .flow-plot { position: relative; height: 420px; }
  .lab.r { text-align: right; }
  .flow-plot svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .lab { position: absolute; font-size: 13px; line-height: 18px; white-space: nowrap; color: var(--muted); }
  .lab b { color: var(--ink); font-weight: 600; margin-right: 4px; }
  .lab .pc { color: var(--muted); margin-left: 4px; }
  .f-node { fill: var(--s-node); } .f-int { fill: var(--s-int); } .f-rej { fill: var(--s-rej); }
  .f-gho { fill: var(--s-gho); } .f-fail { fill: var(--s-fail); } .f-offer { fill: var(--accent); }
  .hatch-bg { fill: var(--hatch-bg); } .hatch-line { stroke: var(--hatch-line); }
  .flow-legend { display: none; }
  .flow-note { color: var(--muted); font-size: 13px; margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  .flow-note span { display: inline-flex; align-items: center; gap: 6px; }
  .sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  /* Stage conversion */
  .steps { display: grid; gap: 14px; flex: 1; align-content: space-between; }
  .step { display: grid; grid-template-columns: 112px minmax(0, 1fr) 132px; align-items: center; gap: 12px; }
  .step-name { font-weight: 500; }
  .step-bar { height: 24px; background: var(--raised); border-radius: 4px; position: relative; overflow: hidden; }
  .step-bar i { position: absolute; inset: 0 auto 0 0; background: var(--s-int); border-radius: 4px 0 0 4px; }
  .step-bar i.offer { background: var(--accent); }
  .step-bar span { position: absolute; left: 8px; top: 3px; font-weight: 600; color: #fff; mix-blend-mode: normal; }
  .step-bar span.out { color: var(--ink); }
  .step-rate { text-align: right; color: var(--muted); font-size: 13px; }
  .step-rate b { color: var(--ink); font-weight: 600; font-size: 14px; }
  .drop { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; background: var(--warn-tint); color: var(--warn-ink); font-size: 12px; font-weight: 500; }

  /* Small column charts (histogram, weekday) */
  .cols { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; }
  .yax { position: relative; height: 160px; font-size: 12px; color: var(--muted); }
  .yax span { position: absolute; left: 0; transform: translateY(-50%); }
  .plot { position: relative; height: 160px; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; align-items: end; }
  .plot .gl { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule); }
  .plot .gl.base { border-top-color: var(--control); }
  .bar-c { position: relative; z-index: 1; background: var(--s-int); min-height: 0; }
  .bar-c.hl { background: var(--accent); }
  .xax { grid-column: 2; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; font-size: 12px; color: var(--muted); text-align: center; }
  #hist, #weekday { flex: 1; display: flex; flex-direction: column; }
  #hist .cols, #weekday .cols { flex: 1; grid-template-rows: minmax(140px, 1fr) auto; }
  #hist .yax, #hist .plot, #weekday .yax, #weekday .plot { height: auto; }

  /* Activity calendar */
  .act { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 24px; align-items: start; }
  .act-stats { display: grid; gap: 14px; }
  .act-stats dt { color: var(--muted); font-size: 13px; }
  .act-stats dd { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .act-stats dd small { font-size: 13px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-left: 2px; }
  .cal-scroll { overflow-x: auto; padding-bottom: 4px; }
  .cal { display: grid; grid-template-rows: 16px repeat(7, 17px); grid-auto-flow: column; grid-auto-columns: 17px; gap: 4px; width: max-content; }
  .cal .mo { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: visible; }
  .cal i { display: block; width: 17px; height: 17px; border-radius: 3px; background: var(--raised); }
  .cal i.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--surface)); }
  .cal i.l2 { background: color-mix(in srgb, var(--accent) 52%, var(--surface)); }
  .cal i.l3 { background: color-mix(in srgb, var(--accent) 76%, var(--surface)); }
  .cal i.l4 { background: var(--accent); }
  .cal i.out { background: transparent; }
  .cal-key { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .cal-key i { width: 12px; height: 12px; border-radius: 3px; display: block; }

  /* ---------- dialogs ---------- */
  dialog {
    border: 0; padding: 0; border-radius: 16px; background: var(--surface); color: var(--ink);
    box-shadow: var(--shadow-float); max-height: calc(100dvh - 48px);
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.32); }
  dialog[open] { animation: rise 220ms var(--ease-out); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) scale(0.98); } }
  .dlg-head { display: flex; align-items: center; gap: 12px; padding: 20px 24px 0; }
  .dlg-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .x { margin-left: auto; width: 32px; padding: 0; }

  .recap { width: min(820px, calc(100vw - 32px)); }
  .recap-body { padding: 16px 24px 0; }
  .recap-range { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .recap-range .muted { font-size: 13px; }
  .designs { display: flex; gap: 20px; justify-content: center; padding: 24px 0 8px; border: 0; margin: 0; min-width: 0; }
  .design { position: relative; display: grid; gap: 10px; justify-items: center; cursor: pointer; }
  .design input { position: absolute; opacity: 0; pointer-events: none; }
  .design .card { width: 230px; outline: 2px solid transparent; outline-offset: 4px; transition: outline-color 150ms ease, transform 200ms var(--ease-out); }
  .design input:checked + .card { outline-color: var(--ink); }
  .design input:focus-visible + .card { outline-color: var(--focus); }
  .design-nav { display: none; }
  .design span.name { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .design input:checked ~ span.name { color: var(--ink); font-weight: 500; }
  .dlg-foot { display: flex; align-items: center; gap: 8px; padding: 16px 24px 20px; border-top: 1px solid var(--rule); margin-top: 16px; }
  .dlg-foot .muted { font-size: 13px; margin-right: auto; }

  /* Recap cards: ported from landing-v5. Pictures of the exported PNG, so the palette never follows the theme. */
  .card {
    --c-ink: #18181b; --c-muted: #52525b; --c-field: #e6e6e9; --c-paper: #ffffff;
    container-type: inline-size; aspect-ratio: 9 / 16; border-radius: 16px; overflow: hidden;
    display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 14px;
    font-size: 13px; line-height: 1.3; text-align: left; color: var(--c-ink);
  }
  .card .soft { color: var(--c-muted); }
  .card-ink { background: var(--c-ink); color: #fafafa; }
  .card-ink .soft { color: #c4c4c8; }
  .card-field { background: var(--c-field); }
  .card-paper { background: var(--c-paper); box-shadow: inset 0 0 0 1px #e4e4e7; }
  :root[data-theme="dark"] .card-ink { box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.12); }
  .card-head { font-weight: 500; }
  .n-xl { font-size: 34cqw; font-weight: 600; line-height: 0.9; letter-spacing: -0.05em; }
  .n-l { font-size: 17cqw; font-weight: 600; line-height: 1.05; letter-spacing: -0.04em; }
  .n-m { font-size: 9cqw; font-weight: 600; line-height: 1.05; letter-spacing: -0.03em; }
  .stats { display: grid; gap: 5cqw; }
  .cbar { margin-top: auto; display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; }
  .cbar span { display: block; height: 100%; }
  .seg-int { background: var(--c-field); } .seg-rej { background: #a1a1aa; } .seg-gho { background: #71717a; }
  .seg-wait { background: repeating-linear-gradient(45deg, #a1a1aa 0 2px, transparent 2px 5px); }
  .bar-key { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: -6px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: auto; }
  .tiles div { background: rgb(24 24 27 / 0.08); border-radius: 8px; padding: 8px 10px; display: grid; gap: 2px; }
  .rank { display: grid; margin-bottom: auto; }
  .rank li { display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: baseline; padding: 8px 0; border-top: 1px solid rgb(24 24 27 / 0.12); }
  .rank li b { font-size: 15px; font-weight: 600; }
  .card-foot { margin-top: auto; display: flex; flex-wrap: wrap; gap: 4px 8px; justify-content: space-between; align-items: center; }
  .card-ink .card-foot { margin-top: 0; }
  .card-foot img { height: 15px; width: auto; }

  /* Settings */
  .settings { width: min(880px, calc(100vw - 32px)); height: min(620px, calc(100dvh - 48px)); }
  .settings[open] { display: grid; grid-template-columns: 220px minmax(0, 1fr); }
  .set-nav { background: var(--bg); border-right: 1px solid var(--border); padding: 20px 12px; }
  .set-tabs { display: flex; flex-direction: column; gap: 2px; }
  .set-nav h2 { font-size: 18px; font-weight: 600; padding: 0 10px 14px; letter-spacing: -0.01em; }
  .set-nav button {
    display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 8px;
    background: transparent; color: var(--muted); font-weight: 500; text-align: left; cursor: pointer;
  }
  .set-nav button[aria-selected="true"] { background: var(--raised); color: var(--ink); }
  @media (hover: hover) and (pointer: fine) { .set-nav button:hover { color: var(--ink); } }
  .set-main { overflow-y: auto; padding: 24px 32px 32px; position: relative; }
  .set-main .x { position: absolute; right: 16px; top: 16px; }
  .set-main h3 { font-size: 20px; font-weight: 600; letter-spacing: -0.02em; padding-right: 40px; }
  .set-main > p.lead { color: var(--muted); margin-top: 4px; }
  .set-sec { margin-top: 24px; padding-top: 24px; border-top: 1px solid var(--border); }
  .set-sec:first-of-type { border-top: 0; padding-top: 0; }
  .set-sec h4 { font-size: 14px; font-weight: 600; margin: 0 0 4px; }
  .row-s { display: flex; align-items: center; gap: 16px; padding: 12px 0; }
  .row-s + .row-s { border-top: 1px solid var(--rule); }
  .row-s .txt { min-width: 0; flex: 1; }
  .row-s .txt b { font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .row-s .txt span { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .row-s .ctl { flex: none; display: flex; align-items: center; gap: 8px; }
  .toggle { width: 32px; height: 20px; border-radius: 999px; background: var(--field); position: relative; border: 0; padding: 0; }
  .toggle::after { content: ""; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / 0.2); }
  .toggle[disabled] { cursor: not-allowed; }
  .ghost-form { display: grid; gap: 16px; margin-top: 16px; }
  .ghost-input { display: flex; align-items: center; gap: 10px; }
  .ghost-input input { width: 88px; height: 40px; font-size: 16px; }
  .preview { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: grid; gap: 10px; }
  .preview .tl { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; font-size: 13px; }
  .preview .tl .line { height: 4px; border-radius: 2px; background: linear-gradient(to right, var(--s-int) var(--p, 100%), var(--raised) 0); }
  .form-end { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
  .stamp { color: var(--muted); font-size: 13px; }
  .choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px; }
  .choice { position: relative; display: grid; gap: 8px; padding: 10px; border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .choice input { position: absolute; opacity: 0; }
  .choice:has(input:checked) { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .choice:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
  .choice .sample { height: 56px; border-radius: 8px; border: 1px solid var(--border); display: grid; grid-template-columns: 30% 1fr; overflow: hidden; }
  .choice .sample i { display: block; }
  .choice span { font-weight: 500; font-size: 13px; }
  .mini-cards { display: flex; gap: 6px; justify-content: center; }
  .mini-cards i { width: 27px; height: 48px; border-radius: 4px; display: block; }
  .danger-sec h4 { color: var(--danger); }

  /* ---------- tablet ---------- */
  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi:nth-child(4) { border-left: 0; }
    .kpi:nth-child(n + 4) { border-top: 1px solid var(--rule); }
    .span-7, .span-5, .span-8, .span-4, .span-6 { grid-column: span 12; }
    .step { grid-template-columns: 104px minmax(0, 1fr) 124px; }
  }
  @media (max-width: 860px) {
    .designs { justify-content: flex-start; overflow-x: auto; scroll-snap-type: x mandatory; padding-left: 4px; padding-right: 4px; }
    .design { scroll-snap-align: center; flex: none; }
    .design .card { width: 210px; }
    .flow-plot .lab { display: none; }
    .flow-plot { height: 260px; }
    .flow-legend { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; margin-top: 16px; }
    .flow-legend dt.sub { padding-left: 14px; color: var(--muted); }
    .flow-legend dd { font-weight: 600; text-align: right; }
    .act { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .act-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* ---------- phone ---------- */
  @media (max-width: 639px) {
    :root { --top-h: 52px; --bottom-h: 64px; --m: 16px; }
    body { font-size: 15px; }
    .top .tabs, .top .add { display: none; }
    .logo img { height: 22px; }
    .bottom {
      display: grid; grid-template-columns: 1fr 64px 1fr; align-items: center;
      position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: calc(var(--bottom-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom); background: var(--bg); border-top: 1px solid var(--border);
    }
    .bottom a { display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: none; padding: 8px 0; }
    .bottom a[aria-current="page"] { color: var(--ink); }
    .bottom a .i { width: 20px; height: 20px; }
    .bottom .add-fab { justify-self: center; width: 44px; height: 44px; border-radius: 50%; padding: 0; }
    .bottom .add-fab .i { width: 20px; height: 20px; }
    main { padding-bottom: var(--bottom-h); }
    .tracker[data-view="board"] { padding-bottom: 0; }

    .bar { gap: 10px; padding-top: 12px; }
    .bar .search { order: 3; width: 100%; margin-left: 0; }
    .bar .seg .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .bar .seg button { padding: 0 9px; }
    .bar .search input { height: 40px; }
    .col { width: min(300px, calc(100vw - 56px)); }
    .board { scroll-snap-type: x mandatory; scroll-padding: 0 var(--m); }
    .col { scroll-snap-align: start; }

    .table-wrap { padding: 0 0 24px; }
    .table { border-radius: 0; border-left: 0; border-right: 0; }
    .table, .table tbody { display: block; }
    .table thead { display: none; }
    .table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 12px 16px; border-top: 1px solid var(--rule); }
    .table tr:first-child { border-top: 0; }
    .table td { padding: 0; border: 0; }
    .table td.c-loc, .table td.c-upd { display: none; }
    .table td.c-st { grid-row: 1; grid-column: 2; }
    .table td.c-app { grid-column: 1 / -1; color: var(--muted); font-size: 13px; text-align: left; padding-left: 44px; }
    .table td.c-app::before { content: attr(data-pre); }

    .title-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; padding-top: 16px; gap: 12px; }
    .title-row h1 { font-size: 22px; }
    .title-end { display: contents; }
    .recap-btn { grid-column: 2; grid-row: 1; }
    .title-end .seg { grid-column: 1 / -1; overflow-x: auto; max-width: 100%; justify-self: start; }
    .custom.on { grid-column: 1 / -1; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi { padding: 14px 16px; }
    .kpi:nth-child(odd) { border-left: 0; }
    .kpi:nth-child(4) { border-left: 1px solid var(--rule); }
    .kpi:nth-child(n + 3) { border-top: 1px solid var(--rule); }
    .kpi .v { font-size: 22px; }
    .panel { padding: 16px; }
    .panel-head { flex-wrap: wrap; row-gap: 2px; }
    .panel-head .aside { margin-left: 0; width: 100%; text-align: left; }
    .panel-head .info { margin-left: auto; }
    .step { grid-template-columns: 1fr auto; gap: 6px 12px; }
    .step-bar { grid-column: 1 / -1; grid-row: 2; }
    .act-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .act-stats dd { font-size: 18px; }

    dialog { max-height: 100dvh; max-width: 100vw; }
    .recap, .settings { width: 100vw; height: 100dvh; border-radius: 0; }
    .recap[open] { display: flex; flex-direction: column; }
    .recap-body { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 0; }
    /* The card takes all the room the sheet has, kept at 9:16. */
    .design-stage { flex: 1; min-height: 0; container-type: size; }
    .recap .designs { height: 100%; overflow: visible; justify-content: center; align-items: center; padding: 12px 0; scroll-snap-type: none; }
    .recap .design { flex: none; }
    .recap .design:not(:has(input:checked)) { display: none; }
    .recap .design .card { width: min(calc(100cqw - 4px), calc((100cqh - 28px) * 9 / 16)); outline: 0; }
    .recap .design span.name { display: none; }
    .design-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 12px; }
    .design-nav .arrow { width: 44px; height: 44px; padding: 0; border-radius: 50%; }
    .design-mid { display: grid; justify-items: center; gap: 4px; }
    .dots { display: flex; gap: 2px; }
    /* Each dot is an 8px mark inside a 24px target (WCAG 2.5.8); the chosen one is filled ink, the rest an outline. */
    .dots button { width: 24px; height: 24px; padding: 0; border: 0; border-radius: 50%; background: transparent; display: grid; place-items: center; cursor: pointer; }
    .dots button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--muted); transition: background-color 150ms ease, box-shadow 150ms ease; }
    .dots button[aria-current="true"]::before { background: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
    #design-pos { font-size: 14px; font-weight: 500; }
    .dlg-head { padding: 14px 16px 0; }
    .dlg-foot { padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .dlg-foot .muted { display: none; }
    .dlg-foot .btn { flex: 1; height: 44px; }
    .recap-range .seg { overflow-x: auto; max-width: 100%; }
    .settings[open] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .set-nav { border-right: 0; border-bottom: 1px solid var(--border); padding: 14px 0 0; }
    .set-nav h2 { padding: 0 64px 10px 16px; }
    .set-tabs { flex-direction: row; overflow-x: auto; gap: 4px; padding: 0 16px 10px; }
    .set-tabs button { flex: none; height: 36px; }
    .set-main { padding: 20px 16px 32px; }
    .set-main .x { position: fixed; right: 12px; top: 10px; z-index: 2; width: 40px; height: 40px; }
    .row-s { flex-wrap: wrap; }
    .row-s .ctl { width: 100%; }
    .row-s .ctl.end { width: auto; }
    .choices { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>

<script>
/* ======================= sample data ======================= */
// Everything on every screen is computed from this one list, so the board, the
// table, the analytics and the recap can never disagree.
const TODAY = '2026-11-10';
const DAY = 864e5;
const dn = (s) => Math.round(Date.parse(s + 'T00:00:00Z') / DAY);
const ds = (n) => new Date(n * DAY).toISOString().slice(0, 10);
const T = dn(TODAY);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const md = (n) => { const d = new Date(n * DAY); return `${MON[d.getUTCMonth()]} ${d.getUTCDate()}`; };
const wd = (n) => (new Date(n * DAY).getUTCDay() + 6) % 7; // Monday = 0
function mulberry(seed) { return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const R = mulberry(11);
const pick = (a) => a[Math.floor(R() * a.length)];

const COMPANIES = ['Northwind', 'Halcyon Labs', 'Brightline', 'Kestrel', 'Fieldnote', 'Copperleaf', 'Juniper Health', 'Tidewater', 'Lumen Freight', 'Parcelwise', 'Orbital Bank', 'Quarry', 'Stackhouse', 'Meridian Maps', 'Foxglove', 'Pinecrest Analytics', 'Bluejay', 'Harbor Labs', 'Sable Systems', 'Driftwood', 'Corvid Security', 'Lantern', 'Marlow Health', 'Granite Cloud', 'Waypoint', 'Ferrous', 'Nimbus Ledger', 'Tandem Grid', 'Sorrel', 'Ironbark', 'Plover', 'Wren Health', 'Arcadia Transit', 'Saltbox', 'Kitebird', 'Verdant Energy', 'Mosaic Learning', 'Cinder', 'Ridgeline', 'Oakhurst', 'Fathom Data', 'Larkspur', 'Beacon Pay', 'Thistle', 'Quill', 'Pebble Logistics', 'Alder Robotics', 'Seastack', 'Hollow Pine', 'Trellis', 'Bramble', 'Clearwater Insurance', 'Elm Street Bank', 'Glasshouse', 'Keel', 'Lodestar', 'Mapleway', 'Nettle', 'Outpost', 'Prism Health', 'Redwood Ledger', 'Summit Grid', 'Tern', 'Umber', 'Vantage Freight', 'Westwind', 'Yarrow', 'Zephyr Labs'];
const ROLES = ['Software Engineer, New Grad', 'Software Engineer I', 'Frontend Engineer', 'Backend Engineer', 'Full-Stack Engineer', 'Platform Engineer I', 'Data Engineer, New Grad', 'Mobile Engineer (iOS)', 'Software Engineer, Infrastructure', 'Associate Software Engineer', 'Software Developer', 'Site Reliability Engineer I'];
const LOCS = ['Remote (US)', 'Remote (US)', 'New York, NY', 'Seattle, WA', 'San Francisco, CA', 'Austin, TX', 'Boston, MA', 'Chicago, IL', 'Denver, CO', 'Atlanta, GA'];
let ghostDays = 14;
const deck = COMPANIES.slice().sort(() => R() - 0.5);
let ci = 0;
const nextCompany = () => deck[ci++ % deck.length];

const apps = [];
let uid = 0;
function makeApp(d) {
  const a = { id: ++uid, company: nextCompany(), title: pick(ROLES), location: pick(LOCS), date_saved: null, date_applied: ds(d), override: null, status: 'applied', updated: d };
  const age = T - d;
  const responds = R() < 0.55;
  const delay = 2 + Math.floor(Math.pow(R(), 1.7) * 28);
  if (!responds || age < delay) {
    if (age >= ghostDays) { a.status = 'ghosted'; a.updated = d + ghostDays; }
    return a;
  }
  if (R() < 0.62) { a.status = 'rejected'; a.updated = d + delay; return a; }
  const out = 7 + Math.floor(R() * 30);
  if (age < delay + out) { a.status = 'interviewing_oa'; a.updated = d + delay + Math.floor((age - delay) * R() * 0.6); return a; }
  a.status = R() < 0.12 ? 'offer' : 'failed'; a.updated = d + delay + out;
  return a;
}
for (let d = T - 186; d <= T; d++) {
  const ramp = 0.45 + 0.75 * ((d - (T - 186)) / 186);
  let p = ramp * (wd(d) >= 5 ? 0.3 : 1.05);
  if (d >= T - 78 && d <= T - 72) p = 0; // a week off (Mon Aug 24 to Sun Aug 30): it breaks the streak
  let n = 0;
  while (R() < p && n < 3) { n++; p *= 0.45; }
  for (let i = 0; i < n; i++) apps.push(makeApp(d));
}
// Saved, not applied yet.
[1, 2, 4, 6, 9, 15, 19, 27].forEach((ago) => apps.push({ id: ++uid, company: nextCompany(), title: pick(ROLES), location: pick(LOCS), date_saved: ds(T - ago), date_applied: null, override: null, status: 'saved', updated: T - ago }));
// Per-application ghost limits: two applied jobs wait 21 days instead of 14.
apps.filter((a) => a.status === 'applied').slice(0, 2).forEach((a) => { a.override = 21; });
apps.filter((a) => a.status === 'rejected').slice(-1).forEach((a) => { a.override = 30; });

const STATUSES = ['saved', 'applied', 'interviewing_oa', 'offer', 'rejected', 'failed', 'ghosted'];
const LABEL = { saved: 'Saved', applied: 'Applied', interviewing_oa: 'Interviewing / OA', offer: 'Offer', rejected: 'Rejected', failed: 'Failed Interview/OA', ghosted: 'Ghosted' };
const RESPONDED = ['interviewing_oa', 'offer', 'rejected', 'failed'];
const STALE_DAYS = 28;
const limitOf = (a) => a.override || ghostDays;
const quietFor = (a) => T - dn(a.date_applied);
const initial = (s) => s.trim()[0].toUpperCase();
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
const icon = (id, cls = '') => `<svg class="i ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;

/* ======================= metrics (same definitions as the backend) ======================= */
const RANGES = { week: 'Week', month: 'Month', year: 'Year', all: 'All', custom: 'Custom' };
const RANGE_TITLE = { week: 'This week', month: 'This month', year: 'This year', all: 'All time' };
const custom = { start: dn('2026-09-01'), end: dn('2026-10-31') };
function windowOf(r) {
  if (r === 'all') return { start: null, end: T };
  if (r === 'custom') return { start: custom.start, end: custom.end };
  return { start: T - { week: 7, month: 30, year: 365 }[r] + 1, end: T };
}
const prevOf = (w) => (w.start === null ? null : { start: w.start - (w.end - w.start + 1), end: w.start - 1 });
const inWindow = (a, w) => a.date_applied && (w.start === null || dn(a.date_applied) >= w.start) && dn(a.date_applied) <= w.end;
const pct = (part, whole) => (whole ? Math.round((part / whole) * 100) : 0);
function stats(w) {
  const list = apps.filter((a) => inWindow(a, w));
  const c = (s) => list.filter((a) => a.status === s).length;
  const s = { list, total: list.length, ap: c('applied'), io: c('interviewing_oa'), of: c('offer'), rj: c('rejected'), fl: c('failed'), gh: c('ghosted') };
  s.responded = s.io + s.of + s.rj + s.fl;
  s.interviews = s.io + s.of + s.fl;
  s.responseRate = pct(s.responded, s.total);
  s.ghostRate = pct(s.gh, s.total);
  s.rejFailRate = pct(s.rj + s.fl, s.total);
  s.days = list.filter((a) => RESPONDED.includes(a.status)).map((a) => a.updated - dn(a.date_applied)).filter((x) => x >= 0);
  s.avgDays = s.days.length ? Math.round((s.days.reduce((x, y) => x + y, 0) / s.days.length) * 10) / 10 : null;
  console.assert(s.ap + s.io + s.of + s.rj + s.fl + s.gh === s.total, 'statuses must sum to the total');
  return s;
}
function periodText(w) {
  const a = w.start === null ? Math.min(...apps.filter((x) => x.date_applied).map((x) => dn(x.date_applied))) : w.start;
  const ya = new Date(a * DAY).getUTCFullYear(), yb = new Date(w.end * DAY).getUTCFullYear();
  if (ya !== yb) return `${md(a)}, ${ya} – ${md(w.end)}, ${yb}`;
  const ma = new Date(a * DAY).getUTCMonth(), mb = new Date(w.end * DAY).getUTCMonth();
  return ma === mb ? `${md(a)} – ${new Date(w.end * DAY).getUTCDate()}` : `${md(a)} – ${md(w.end)}`;
}

/* ======================= state + routing ======================= */
const state = { page: 'tracker', view: 'board', q: '', statuses: new Set(STATUSES), colSort: {}, sort: { key: 'updated', dir: -1 }, range: 'month', expanded: new Set(), rows: 50 };
try { const v = localStorage.getItem('wf-app-view'); if (v === 'board' || v === 'table') state.view = v; } catch (e) {}

function route() {
  const h = location.hash.slice(1);
  const parts = h.split('/');
  if (parts[0] === 'analytics') state.page = 'analytics';
  else if (parts[0] === 'board' || parts[0] === 'table') { state.page = 'tracker'; state.view = parts[0]; }
  else if (!h) state.page = 'tracker';
  render();
  if (parts.includes('recap')) { state.page = 'analytics'; render(); openRecap(); }
  const si = parts.indexOf('settings');

}

/* ======================= tracker ======================= */
const EMPTY = {
  saved: 'Nothing saved. Jobs you want to come back to land here.',
  applied: 'No applications waiting on a reply.',
  interviewing_oa: 'No interviews in progress right now.',
  offer: 'No offers yet.',
  rejected: 'No rejections.',
  failed: 'No interviews lost.',
  ghosted: 'Nothing has gone quiet.',
};
const COL_LIMIT = 12;

function visibleApps() {
  const q = state.q.trim().toLowerCase();

}

function dateLine(a) {

}

// The ghost countdown, drawn as a ring in the card's free right-hand space.
function ringHtml(a) {
  let p, txt, cls, label, tip;
  if (a.status === 'applied') {
    const q = quietFor(a), lim = limitOf(a), left = Math.max(lim - q, 0);
    p = Math.min(1, q / lim); txt = `${left}d`; cls = left <= 3 ? 'near' : '';
    label = `${plural(left, 'day')} until Ghosted. Quiet ${q} of ${lim} days${a.override ? ' (its own limit)' : ''}.`;
    tip = `Days until marked Ghosted · quiet ${q} of ${lim}`;
  } else if (a.status === 'interviewing_oa' && T - a.updated > STALE_DAYS) {
    p = 1; txt = `${T - a.updated}d`; cls = 'stale'; label = `No update in ${T - a.updated} days.`; tip = 'Days since this interview was updated';
  } else return '';
  const C = 2 * Math.PI * 15;
  return `<span class="ring ${cls}" role="img" aria-label="${label}" data-tip="${tip}"><svg viewBox="1.25 1.25 33.5 33.5" aria-hidden="true"><circle cx="18" cy="18" r="15" class="ring-track"/><circle cx="18" cy="18" r="15" class="ring-arc" stroke-dasharray="${(p * C).toFixed(1)} ${C.toFixed(1)}"/></svg><span aria-hidden="true">${txt}</span></span>`;
}

function cardHtml(a) {
  return `<article class="job" aria-label="${esc(a.title)} at ${esc(a.company)}">
    <div class="job-main">
      <div class="job-top"><span class="mono" aria-hidden="true">${initial(a.company)}</span><span class="job-co">${esc(a.company)}</span></div>
      <h3 class="job-title">${esc(a.title)}</h3>

    </div>

}

// Column sorts: by the date on the card (saved or applied), or by company.
const COL_SORTS = [['new', 'Newest first', 'sort-new'], ['old', 'Oldest first', 'sort-old'], ['az', 'Company A–Z', 'sort-az'], ['za', 'Company Z–A', 'sort-za']];
const dateOf = (a) => (a.status === 'saved' ? dn(a.date_saved) : dn(a.date_applied));
const byCo = (x, y) => x.company.localeCompare(y.company) || x.title.localeCompare(y.title);
const COL_CMP = { new: (x, y) => dateOf(y) - dateOf(x) || byCo(x, y), old: (x, y) => dateOf(x) - dateOf(y) || byCo(x, y), az: byCo, za: (x, y) => byCo(y, x) };
const colSortOf = (s) => state.colSort[s] || 'new';

function renderTracker() {
  const sec = document.getElementById('tracker-page');
  sec.dataset.view = state.view;

  document.getElementById('tracker-count').textContent = list.length === tracked ? String(tracked) : `${list.length} of ${tracked}`;
  document.getElementById('board-wrap').hidden = state.view !== 'board';
  document.getElementById('table-wrap').hidden = state.view !== 'table';
  if (state.view === 'board') renderBoard(list); else renderTable(list);
}

function renderBoard(list) {
  const cols = STATUSES.filter((s) => state.statuses.has(s));
  const board = document.getElementById('board-view');
  board.innerHTML = cols.length ? cols.map((s) => {
    const sort = colSortOf(s);
    const [, sortLabel, sortIcon] = COL_SORTS.find((c) => c[0] === sort);
    const rows = list.filter((a) => a.status === s).sort(COL_CMP[sort]);
    const open = state.expanded.has(s);
    const shown = open ? rows : rows.slice(0, COL_LIMIT);
    const hidden = rows.length - COL_LIMIT;
    return `<section class="col" aria-labelledby="col-${s}">
      <div class="col-head"><span class="dot dot-${s}" aria-hidden="true"></span><h2 id="col-${s}">${LABEL[s]} <span class="count">${rows.length}</span></h2>
        <button class="btn col-sort" type="button" data-colsort="${s}" aria-haspopup="menu" aria-expanded="false" aria-label="Sort ${LABEL[s]}, ${sortLabel.toLowerCase()}" title="${sortLabel}">${icon(sortIcon)}</button></div>

// Desktop fade at the board's right edge: sits above the scrollbar, and goes once you reach the end.
function updateFade() {

}
document.getElementById('board-view').addEventListener('scroll', updateFade, { passive: true });

const SORTS = { company: (a) => a.company.toLowerCase(), status: (a) => STATUSES.indexOf(a.status), applied: (a) => (a.date_applied ? dn(a.date_applied) : -1), updated: (a) => a.updated };
function renderTable(list) {
  const { key, dir } = state.sort;

      <td><div class="who"><span class="mono" aria-hidden="true">${initial(a.company)}</span><div><b>${esc(a.title)}</b><span>${esc(a.company)}</span></div></div></td>

      <td class="c-loc muted">${esc(a.location)}</td>

}

document.querySelector('.bar .seg').addEventListener('click', (e) => {

/* ======================= menus ======================= */
let openMenuEl = null;
function closeMenu(returnFocus = true) {
  if (!openMenuEl) return;
  const { el, anchor } = openMenuEl;
  el.remove();
  anchor.setAttribute('aria-expanded', 'false');
  openMenuEl = null;
  if (returnFocus && anchor.isConnected) anchor.focus();
}
function openMenu(anchor, html, label, onPick) {
  if (openMenuEl && openMenuEl.anchor === anchor) { closeMenu(); return; }
  closeMenu(false);
  const el = document.createElement('div');
  el.className = 'menu';
  el.setAttribute('role', 'menu');
  el.setAttribute('aria-label', label);
  el.innerHTML = html;
  document.body.append(el);
  const r = anchor.getBoundingClientRect(), m = el.getBoundingClientRect();
  const below = r.bottom + 6 + m.height < innerHeight;
  const left = Math.max(8, Math.min(r.right - m.width, innerWidth - m.width - 8));
  el.style.left = `${left}px`;
  el.style.top = `${below ? r.bottom + 6 : r.top - 6 - m.height}px`;
  el.style.setProperty('--origin', `${below ? 'top' : 'bottom'} ${left + m.width / 2 < r.left + r.width / 2 ? 'right' : 'left'}`);
  anchor.setAttribute('aria-expanded', 'true');
  openMenuEl = { el, anchor };
  const items = () => Array.from(el.querySelectorAll('[role^="menuitem"]'));
  (el.querySelector('[data-s][aria-checked="true"]') || items()[0])?.focus();
  el.addEventListener('keydown', (e) => {
    const list = items(), i = list.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); list[(i + 1) % list.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); list[(i - 1 + list.length) % list.length].focus(); }
    if (e.key === 'Escape') { e.preventDefault(); closeMenu(); }
    if (e.key === 'Tab') closeMenu(false);
  });
  el.addEventListener('click', (e) => { const it = e.target.closest('[role^="menuitem"]'); if (it) onPick(it, e); });
}
document.addEventListener('pointerdown', (e) => { if (openMenuEl && !openMenuEl.el.contains(e.target) && !openMenuEl.anchor.contains(e.target)) closeMenu(false); });
window.addEventListener('resize', () => closeMenu(false));

const tip = Object.assign(document.createElement('div'), { id: 'tip', className: 'tip', hidden: true });
tip.setAttribute('role', 'tooltip');
document.body.append(tip);
let tipFor = null, tipPinned = false;
function showTip(el, pinned = false) {
  if (tipFor && tipFor !== el) hideTip();
  tip.textContent = el.dataset.tip;
  tip.classList.toggle('lead', el.classList.contains('info'));
  tip.hidden = false;
  tipFor = el; tipPinned = pinned;
  el.setAttribute('aria-describedby', 'tip');
  if (el.matches('button')) el.setAttribute('aria-expanded', 'true');
  const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
  const below = r.bottom + 8 + t.height < innerHeight;
  tip.style.top = `${below ? r.bottom + 6 : r.top - 6 - t.height}px`;
  tip.style.left = `${Math.max(8, Math.min(r.right - t.width, innerWidth - t.width - 8))}px`;
}
function hideTip() {
  if (!tipFor) return;
  tipFor.removeAttribute('aria-describedby');
  if (tipFor.matches('button')) tipFor.setAttribute('aria-expanded', 'false');
  tip.hidden = true; tipFor = null; tipPinned = false;
}
document.addEventListener('pointerover', (e) => { const el = e.target.closest('[data-tip]'); if (el && e.pointerType === 'mouse' && el !== tipFor) showTip(el); });
document.addEventListener('pointerout', (e) => { const el = e.target.closest('[data-tip]'); if (el && el === tipFor && !tipPinned && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', (e) => { const el = e.target.closest('button[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', (e) => { if (tipFor && e.target === tipFor && !tipPinned) hideTip(); });
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-tip]');
  if (el) { if (tipFor === el && tipPinned) hideTip(); else showTip(el, true); }
  else if (tipPinned) hideTip();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideTip(); });
window.addEventListener('scroll', hideTip, true);
window.addEventListener('resize', hideTip);

function openStatusMenu(anchor, a) {

}

function openColSort(anchor, s) {

const rangeSeg = document.getElementById('range');

// The comparison period lives in a tooltip and in screen-reader text, not on screen.
let baseline = '';
function deltaHtml(cur, prev, { unit = '', good = 'up', dec = 0, newWhenZero = false } = {}) {
  if (prev === null || prev === undefined || cur === null) return '<span class="delta">—</span>';
  const d = Math.round((cur - prev) * 10 ** dec) / 10 ** dec;
  const vs = `<span class="sr-only"> compared with ${baseline}</span>`;
  if (d === 0) return `<span class="delta" title="vs ${baseline}">No change${vs}</span>`;
  const better = good === 'up' ? d > 0 : d < 0;
  const txt = `${d > 0 ? '+' : '−'}${Math.abs(d).toFixed(dec)}${unit}${newWhenZero && prev === 0 ? ' (new)' : ''}`;
  return `<span class="delta ${better ? 'good' : 'bad'}" title="vs ${baseline}">${txt}${vs}</span>`;
}

function renderAnalytics() {
  rangeSeg.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.range === state.range)));
  document.getElementById('custom').classList.toggle('on', state.range === 'custom');
  const w = windowOf(state.range), pw = prevOf(w);
  const s = stats(w), p = pw ? stats(pw) : null;
  const period = periodText(w);

  // KPIs: one divided strip; deltas are the difference of the values as shown.
  baseline = pw ? periodText(pw) : '';
  const k = [
    ['Applications', s.total, '', deltaHtml(s.total, p?.total, { newWhenZero: true })],
    ['Response rate', s.responseRate, '%', deltaHtml(s.responseRate, p?.responseRate, { unit: ' pts' })],
    ['Interviews', s.interviews, '', deltaHtml(s.interviews, p?.interviews, { newWhenZero: true })],
    ['Offers', s.of, '', deltaHtml(s.of, p?.of, { newWhenZero: true })],
    ['Ghost rate', s.ghostRate, '%', deltaHtml(s.ghostRate, p?.ghostRate, { unit: ' pts', good: 'down' })],
    ['Avg. time to hear back', s.avgDays === null ? '—' : s.avgDays.toFixed(1), s.avgDays === null ? '' : 'days', deltaHtml(s.avgDays, p?.avgDays ?? null, { dec: 1, good: 'down' })],
  ];
  document.getElementById('kpis').innerHTML = k.map(([l, v, u, d]) => `<div class="kpi"><dt>${l}</dt><dd><span class="v">${v}${u ? `<small>${u}</small>` : ''}</span>${d}</dd></div>`).join('');

  // Stage conversion + the finding.
  const steps = [['Applied', s.total, null], ['Heard back', s.responded, 'of applied'], ['Interview', s.interviews, 'of those who replied'], ['Offer', s.of, 'of interviews']];
  let worst = null;
  // The finding names the step that loses the most applications (a count, so three interviews can't outweigh forty replies).
  steps.forEach((st, i) => { if (i && steps[i - 1][1]) { const r = st[1] / steps[i - 1][1], lost = steps[i - 1][1] - st[1]; st.push(r); if (lost && (!worst || lost > worst.lost)) worst = { i, r, lost }; } });
  document.getElementById('conv-info').dataset.tip = `${period}\nA rejection counts as hearing back. Interviews include offers and failed interviews/OAs.`;
  document.getElementById('steps').innerHTML = steps.map(([name, n, of, r], i) => {
    const w100 = s.total ? (n / s.total) * 100 : 0;
    return `<div class="step"><span class="step-name">${name}</span>
      <span class="step-bar" aria-hidden="true"><i class="${name === 'Offer' ? 'offer' : ''}" style="width:${w100}%"></i><span class="${w100 < 12 ? 'out' : ''}" style="${w100 < 12 ? `left:calc(${w100}% + 8px)` : ''}">${n}</span></span>
      <span class="step-rate">${i === 0 ? `<b>${n}</b> sent` : `<b>${steps[i - 1][1] ? Math.round(r * 100) : 0}%</b> ${of}`}${worst && worst.i === i ? '<br><span class="drop">Most lost here</span>' : ''}</span>
      <span class="sr-only">${name}: ${n}</span></div>`;
  }).join('');

  renderFlow(s, period);
  renderHist(s);
  renderActivity(w);
  renderWeekday(s);
}

function ribbon(x0, x1, a0, a1, b0, b1) {
  const xm = (x0 + x1) / 2;
  return `M${x0} ${a0} C${xm} ${a0} ${xm} ${b0} ${x1} ${b0} L${x1} ${b1} C${xm} ${b1} ${xm} ${a1} ${x0} ${a1} Z`;
}
function renderFlow(s, period) {
  document.getElementById('flow-aside').textContent = `${plural(s.total, 'application')} · ${period}`;
  const H = innerWidth < 640 ? 260 : 420, top = 30, bottomPad = 6, gap = 26, NW = 12;
  const I = s.interviews, Rj = s.rj, G = s.gh, W = s.ap, O = s.of, F = s.fl, S = s.io;
  // The last column present always sits on the panel's right edge: with no offers or failed interviews yet, that's the second column.
  const has3 = O + F > 0;
  const x1 = 0, x2 = has3 ? 494 : 1000 - NW, x3 = 1000 - NW;
  const k = s.total ? (H - top - bottomPad - 2 * gap) / s.total : 0;
  // Column 1: one node, split top to bottom into interview, rejected, ghosted, then the still-waiting part (hatched).
  let y = top;
  const c1 = {}; [['I', I], ['R', Rj], ['G', G], ['W', W]].forEach(([n, v]) => { c1[n] = [y, y + v * k]; y += v * k; });
  // Column 2: interview, rejected, ghosted as separate nodes.
  const yI = top, yR = yI + I * k + gap, yG = yR + Rj * k + gap;
  const c2 = { I: [yI, yI + I * k], R: [yR, yR + Rj * k], G: [yG, yG + G * k] };
  // Interview node splits into offer, failed, then still interviewing (hatched).
  const iO = [yI, yI + O * k], iF = [iO[1], iO[1] + F * k], iS = [iF[1], iF[1] + S * k];
  const yO = yI, yF = yO + O * k + (O ? gap : 0);
  const c3 = { O: [yO, yO + O * k], F: [yF, yF + F * k] };
  let svg = `<svg viewBox="0 0 1000 ${H}" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" class="hatch-bg"/><line x1="0" y1="0" x2="0" y2="6" class="hatch-line" stroke-width="2"/></pattern></defs>`;
  if (I) svg += `<path class="f-int" d="${ribbon(x1 + NW, x2, ...c1.I, ...c2.I)}"/>`;
  if (Rj) svg += `<path class="f-rej" d="${ribbon(x1 + NW, x2, ...c1.R, ...c2.R)}"/>`;
  if (G) svg += `<path class="f-gho" d="${ribbon(x1 + NW, x2, ...c1.G, ...c2.G)}"/>`;
  if (O) svg += `<path class="f-offer" d="${ribbon(x2 + NW, x3, ...iO, ...c3.O)}"/>`;
  if (F) svg += `<path class="f-fail" d="${ribbon(x2 + NW, x3, ...iF, ...c3.F)}"/>`;
  svg += `<rect x="${x1}" y="${top}" width="${NW}" height="${(I + Rj + G) * k}" class="f-node"/>`;
  if (W) svg += `<rect x="${x1}" y="${c1.W[0]}" width="${NW}" height="${W * k}" fill="url(#hatch)"/>`;
  if (O + F) svg += `<rect x="${x2}" y="${yI}" width="${NW}" height="${(O + F) * k}" class="f-node"/>`;
  if (S) svg += `<rect x="${x2}" y="${iS[0]}" width="${NW}" height="${S * k}" fill="url(#hatch)"/>`;
  if (Rj) svg += `<rect x="${x2}" y="${yR}" width="${NW}" height="${Rj * k}" class="f-int"/>`;
  if (G) svg += `<rect x="${x2}" y="${yG}" width="${NW}" height="${G * k}" class="f-int"/>`;
  if (O) svg += `<rect x="${x3}" y="${yO}" width="${NW}" height="${O * k}" class="f-offer"/>`;
  if (F) svg += `<rect x="${x3}" y="${yF}" width="${NW}" height="${F * k}" class="f-node"/>`;
  svg += '</svg>';
  const pc = (n) => `<span class="pc">${pct(n, s.total)}%</span>`;
  // Labels: keep at least 20px apart on each side.
  const spread = (ls) => { ls.sort((a, b) => a.y - b.y); for (let i = 1; i < ls.length; i++) ls[i].y = Math.max(ls[i].y, ls[i - 1].y + 20); return ls; };
  const mid = (r) => (r[0] + r[1]) / 2 - 9;
  const labs = [];
  labs.push(`<span class="lab" style="left:0;top:2px"><b>Applied</b>${s.total}</span>`);
  if (I && has3) labs.push(`<span class="lab" style="left:calc(49.4% - 2px);top:2px"><b>Interviewing / OA</b>${I}${pc(I)}</span>`);
  const right2 = spread([
    W && { y: mid(c1.W), html: `${W} still waiting`, left: '22px' },
  ].filter(Boolean));
  const col2 = spread([
    S && { y: mid(iS), html: `${S} still interviewing` },
    Rj && { y: mid(c2.R), html: `<b>Rejected</b>${Rj}${pc(Rj)}` },
    G && { y: mid(c2.G), html: `<b>Ghosted</b>${G}${pc(G)}` },
  ].filter(Boolean));
  right2.forEach((l) => labs.push(`<span class="lab" style="left:${l.left};top:${l.y}px">${l.html}</span>`));
  if (has3) col2.forEach((l) => labs.push(`<span class="lab" style="left:calc(49.4% + 22px);top:${l.y}px">${l.html}</span>`));
  else {
    // Second column on the right edge: each label sits above its node, right-aligned.
    [I && { y: 2, html: `<b>Interviewing / OA</b>${I}${pc(I)}${S ? ` · ${S} still interviewing` : ''}` }, Rj && { y: c2.R[0] - 22, html: `<b>Rejected</b>${Rj}${pc(Rj)}` }, G && { y: c2.G[0] - 22, html: `<b>Ghosted</b>${G}${pc(G)}` }]
      .filter(Boolean).forEach((l) => labs.push(`<span class="lab r" style="right:0;top:${l.y}px">${l.html}</span>`));
  }
  const out = [O && { y: c3.O[0] - 22, html: `<b>Offer</b>${O}` }, F && { y: c3.F[0] - 22, html: `<b>Failed Interview/OA</b>${F}` }].filter(Boolean);
  if (out.length === 2 && out[1].y < out[0].y + 20) out[1].y = out[0].y + 20;
  if (!s.total) labs.push('<span class="lab" style="left:0;top:40px">No applications in this range.</span>');
  out.forEach((l) => labs.push(`<span class="lab r" style="right:0;top:${Math.max(l.y, 2)}px">${l.html}</span>`));
  document.getElementById('flow').innerHTML = `<div class="flow-plot">${svg}${labs.join('')}</div>`;
  document.getElementById('flow-legend').innerHTML = `<dt>Applied</dt><dd>${s.total}</dd><dt class="sub">Interviewing / OA</dt><dd>${I}</dd><dt class="sub">Rejected</dt><dd>${Rj}</dd><dt class="sub">Ghosted</dt><dd>${G}</dd><dt class="sub">Still waiting</dt><dd>${W}</dd><dt>From Interviewing / OA</dt><dd>${I}</dd><dt class="sub">Offer</dt><dd>${O}</dd><dt class="sub">Failed Interview/OA</dt><dd>${F}</dd><dt class="sub">Still interviewing</dt><dd>${S}</dd>`;
  document.getElementById('flow').setAttribute('aria-label', `Applied ${s.total}: ${I} reached an interview, ${Rj} rejected, ${G} ghosted, ${W} still waiting. Of the interviews: ${O} offer, ${F} failed, ${S} still interviewing.`);
  document.getElementById('flow').setAttribute('role', 'img');
}

function columns(values, labels, { hl = -1, el, label }) {
  const max = Math.max(1, ...values);
  const step = max <= 4 ? 1 : max <= 8 ? 2 : max <= 20 ? 5 : max <= 40 ? 10 : 20;
  const topTick = Math.ceil((max + 0.01) / step) * step;
  const ticks = []; for (let t = 0; t <= topTick; t += step) ticks.push(t);
  el.innerHTML = `<div class="cols" role="img" aria-label="${label}">
    <div class="yax" aria-hidden="true">${ticks.map((t) => `<span style="top:${100 - (t / topTick) * 100}%">${t}</span>`).join('')}</div>
    <div class="plot" aria-hidden="true">${ticks.map((t) => `<span class="gl${t === 0 ? ' base' : ''}" style="top:${100 - (t / topTick) * 100}%"></span>`).join('')}${values.map((v, i) => `<span class="bar-c${i === hl ? ' hl' : ''}" style="height:${(v / topTick) * 100}%" title="${labels[i]}: ${v}"></span>`).join('')}</div>
    <div class="xax" aria-hidden="true">${labels.map((l) => `<span>${l}</span>`).join('')}</div>
  </div>`;
}

function renderHist(s) {
  const bins = [[0, 3, '0–3'], [4, 7, '4–7'], [8, 14, '8–14'], [15, 21, '15–21'], [22, 30, '22–30'], [31, Infinity, '31+']];
  const counts = bins.map(([a, b]) => s.days.filter((d) => d >= a && d <= b).length);
  const sorted = s.days.slice().sort((a, b) => a - b);
  const med = sorted.length ? sorted[Math.floor((sorted.length - 1) / 2)] : null;
  const hl = med === null ? -1 : bins.findIndex(([a, b]) => med >= a && med <= b);
  document.getElementById('hear-info').dataset.tip = `${med === null ? 'No replies in this range' : `Median ${plural(med, 'day')} · ${plural(sorted.length, 'reply', 'replies')}`}\nDays from applying to the last status change. JourneyJob keeps no status history, so this is the closest measure it has.`;
  columns(counts, bins.map((b) => b[2]), { hl, el: document.getElementById('hist'), label: `Replies by days to hear back: ${bins.map((b, i) => `${b[2]} days ${counts[i]}`).join(', ')}.` });
}

function renderWeekday(s) {
  const names = ['M', 'T', 'W', 'T', 'F', 'S', 'S'], full = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  const counts = names.map((_, i) => s.list.filter((a) => wd(dn(a.date_applied)) === i).length);
  const top = counts.indexOf(Math.max(...counts));
  columns(counts, names, { hl: s.total ? top : -1, el: document.getElementById('weekday'), label: `Applications by weekday: ${full.map((d, i) => `${d} ${counts[i]}`).join(', ')}.` });
  document.getElementById('wk-info').dataset.tip = `${plural(s.total, 'application')}\n${s.total ? `You apply most on ${full[top]}s.` : 'Nothing sent in this range.'}`;
}

function renderActivity(w) {
  const end = w.end;
  const span = w.start === null ? 365 : end - w.start + 1;
  const weeks = Math.max(26, Math.min(53, Math.ceil(span / 7)));
  const lastMon = end - wd(end);
  const firstMon = lastMon - (weeks - 1) * 7;
  const per = new Map();
  apps.forEach((a) => { if (a.date_applied) { const d = dn(a.date_applied); per.set(d, (per.get(d) || 0) + 1); } });
  const lvl = (n) => (n === 0 ? '' : n === 1 ? 'l1' : n === 2 ? 'l2' : n === 3 ? 'l3' : 'l4');
  let cells = '';
  let lastMonth = -1;
  for (let c = 0; c < weeks; c++) {
    const mon = firstMon + c * 7;
    const m = new Date(mon * DAY).getUTCMonth();
    cells += `<span class="mo">${m !== lastMonth && c < weeks - 2 ? MON[m] : ''}</span>`;
    lastMonth = m;
    for (let r = 0; r < 7; r++) {
      const d = mon + r;
      const n = per.get(d) || 0;
      cells += d > T ? '<i class="out"></i>' : `<i class="${lvl(n)}" title="${md(d)}: ${plural(n, 'application')}"></i>`;
    }
  }
  // Weekly streaks, Monday to Sunday; the current week counts once it has one application.
  const weekCount = (mon) => { let n = 0; for (let i = 0; i < 7; i++) n += per.get(mon + i) || 0; return n; };
  const thisMon = T - wd(T);
  let streak = 0, m0 = weekCount(thisMon) ? thisMon : thisMon - 7;
  while (weekCount(m0)) { streak++; m0 -= 7; }
  let best = 0, run = 0;
  const firstEver = Math.min(...[...per.keys()]);
  for (let m = firstEver - wd(firstEver); m <= thisMon; m += 7) { if (weekCount(m)) { run++; best = Math.max(best, run); } else run = 0; }
  let activeDays = 0; for (let d = firstMon; d <= Math.min(end, T); d++) if (per.get(d)) activeDays++;
  document.getElementById('act-info').dataset.tip = `Last ${weeks} weeks\nEach square is a day. The darker it is, the more you sent that day. A streak counts weeks, Monday to Sunday, with at least one application.`;
  document.getElementById('act').innerHTML = `
    <dl class="act-stats">
      <div><dt>Current streak</dt><dd>${streak}<small>${streak === 1 ? 'week' : 'weeks'}</small></dd></div>
      <div><dt>Longest streak</dt><dd>${best}<small>weeks</small></dd></div>
      <div><dt>Days you applied</dt><dd>${activeDays}<small>of ${Math.min(end, T) - firstMon + 1}</small></dd></div>
    </dl>
    <div>
      <div class="cal-scroll" id="cal-scroll"><div class="cal" role="img" aria-label="Applications per day over the last ${weeks} weeks. ${activeDays} days with at least one application.">${cells}</div></div>
      <div class="cal-key" aria-hidden="true">Less <i style="background:var(--raised)"></i><i class="l1" style="background:color-mix(in srgb,var(--accent) 28%,var(--surface))"></i><i style="background:color-mix(in srgb,var(--accent) 52%,var(--surface))"></i><i style="background:color-mix(in srgb,var(--accent) 76%,var(--surface))"></i><i style="background:var(--accent)"></i> More</div>
    </div>`;
  const sc = document.getElementById('cal-scroll'); sc.scrollLeft = sc.scrollWidth;
}
